<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>像素乐园皮肤 · 预览</title>
<!-- 由 scripts/build-pixel-preview.mjs 生成，勿手改。改完皮肤 CSS 重跑即可。 -->
<style>
  body {
    margin: 0; padding: 32px; background: #eef2fb;
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 16px; color: #444; margin: 0 0 4px; }
  p.hint { color: #667; margin: 0 0 28px; font-size: 13px; }
  .wk-conversation-content { max-width: 620px; margin: 0 auto; }
  .wk-msg-row { display: flex; gap: 12px; padding: 0 16px; margin: 26px 0; position: relative; }
  .wk-msg-row--send { flex-direction: row-reverse; }
  .wk-msg-row-avatar { width: 36px; height: 36px; border-radius: 6px; flex: none; background: #ccd6ee; }
  .wk-msg-row-content { min-width: 0; }
  .wk-msg-row-header { font-size: 12px; color: #778; margin-bottom: 4px; }
  .wk-msg-row--send .wk-msg-row-header { text-align: right; }
  .wk-markdown {
    position: relative; display: inline-block; max-width: 420px;
    padding: 10px 14px; border-radius: 8px; background: #fff;
  }
  .ai-badge {
    display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: #7c6bf0; color: #fff;
  }
  .wk-reply-block {
    display: block; font-size: 13px; opacity: .85;
    padding: 4px 8px; margin-bottom: 6px; border-left: 2px solid #bbb;
  }

  /* Bot 卡骨架 —— 皮肤只覆盖配色和 banner，布局本来由基础层提供，
     这里补出最小的一份，好让 ::before/::after 的覆盖能落到实处。 */
  .wk-bot-detail-modal { max-width: 400px; margin: 40px auto 0; }
  .wk-modal-shell { background: #fff; border-radius: 16px; overflow: hidden; }
  .wk-bot-detail-content { display: flex; flex-direction: column; }
  .wk-bot-detail-header {
    position: relative; height: 176px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 14px 18px;
  }
  .wk-bot-detail-header::before,
  .wk-bot-detail-header::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 176px;
  }
  .wk-bot-detail-header > * { position: relative; z-index: 1; }
  .wk-bot-detail-header-avatar {
    width: 64px; height: 64px; background: #cfe0ff; align-self: flex-start;
    margin-bottom: 8px;
  }
  .wk-bot-detail-name { font-size: 20px; font-weight: 700; }
  .wk-bot-detail-id { font-size: 12px; }
  .wk-bot-detail-section { margin: 14px 18px 0; padding: 10px 12px; font-size: 13px; }
  .wk-bot-detail-label {
    display: inline-block; font-size: 11px; padding: 2px 8px; margin-bottom: 6px;
  }
  .wk-bot-detail-primary-action {
    margin: 16px 18px 20px; padding: 10px; font: inherit; font-weight: 700;
    cursor: pointer;
  }
</style>
<style>
/* ========================================================
             * 像素乐园皮肤（body[data-octo-skin="pixel"]）—— FC 8-bit 质感（浅色）
             *
             * 精灵是 24×24 手绘 bitmap，由 scripts/build-pixel-sprites.mjs 生成
             * 并内联在下面的标记区里。全部 1x：放大交给 image-rendering: pixelated，
             * 最近邻在任何尺寸都锐利，所以不需要第二套分辨率。
             * 换角色形象 = 改那个脚本里的 bitmap 再跑一次，本段规则不用动。
             * ====================================================== */
            /* PIXEL-SPRITES:BEGIN — 由 scripts/build-pixel-sprites.mjs 生成，勿手改 */
            body[data-octo-skin="pixel"] {
                --octo-px-stand: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAnElEQVR42sWW2w2AIAxFGdmxHM4RmmiIRgX6uK0CTfohfRwqUEhJlx1Ut5yBy4apE4Qn5kG9kq+XypB4chAyDkBEt1pJG18L8A6wIKwvCsjfKKDwnV5B9zWYs005Gzv25RzUDW74aQaSy4B61lIVodk/AfqYUQXSekFbC0H7usNeQtBLA/cRAfoO8PmJv+m3CriFti9v1B56aYTkAFdpPEDqUNArAAAAAElFTkSuQmCC");
                --octo-px-jump: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAlElEQVR42sWW3Q2AIAyEGdmxGM4RSDRGIwpXelQpTfpAae+D8BtC2zbSu+0sXFbOO0G8MAaNEo+XyxC7OAnxA6SUbtdEq1wN8CzQIDCXBRxtFvDKnT6D4WswZ5uiPhj7cg7KC879NBPiMqActTQLAlBDckE71gHQxWAsGt+EQYBczAAM4i6AULy1GGAUZtflVzN9VXZNnhpxvM347gAAAABJRU5ErkJggg==");
                --octo-px-diver: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAApklEQVR42mNgwA/+E8BkA7ABf/78wYvJtYigwTgsIt0CQkFEkQUg2mbPH7wYWe3gs4CWQURSRFOSXPEmVUrzAtyAHxURWDElGe7/jRsPwBjZggkTFoAxsgXI6kagBSDDiLEApo7iSMZmAcUpCVcKQrOEYdBagGIJepBRxXAcBmKLB8qDB5sF5PoGrGmFgwYKRrcAjzxhC4jQTJEFDES2HqjWwqAIAABl/nTLCR8FmwAAAABJRU5ErkJggg==");
                --octo-px-diver-jump: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAmElEQVR42mNgwA/+E8BkA7ABf/78wYvJtYigwTgsIt0CQkFEkQUg2mbPH7wYWe3gs4CWQURSRFOSXPEmVUrzAtyAHxURWDElGe7/jRsPwBjZggkTFoAxsgXI6kagBSDDiLEApo7iSMZmAcUpCVcKQrOEIkBTw3FaQk3DaW7BfzwWUCf8VzhoYMXU8AlOw2GYKr6gVauCagAAwgxWDdco7QYAAAAASUVORK5CYII=");
                --octo-px-bubble: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAwCAYAAABwrHhvAAAAbUlEQVR42u3UwQ2AMAiFYQZxRmfsGB3AAdyAXgnReJLXpv+XcOalBcySfvsZy6rkxqVBYqN2+RGrJMRb8xxC0vz3EASQB5AP4RRrKD9EU5zi5UlfTjo3TxtUGuJrffcJIPsC+RBywAAAAABgeQNP2PCEjIj9WwAAAABJRU5ErkJggg==");
                --octo-px-seabed: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAARElEQVR42mNgYGD4TxF+caLiPyUYbsCJBR4EFWNTQz0XELKJJAOIwTBLqOMFQk7GJ0+bQKSKAcTGBH1TIja1gzgQicUAWFIAdk3GhwAAAAAASUVORK5CYII=");
                --octo-px-kelp: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAQCAYAAAArij59AAAAHklEQVR42mNgQID/DCugmAGMMQBeBQOpe9QUaoUqABgJVMGLKQyUAAAAAElFTkSuQmCC");
                --octo-px-chest: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAW0lEQVR42mNgGCDwn0xMnMErIhTIwoQsIttgHBZht+DHDgYwJtVQZH0DawFNg4jKmHQfgNTAggKferLjAJ8FVIlk9GAYfJE8mtEGPg4yDDioggcsJ4+CUUAeAAAVy1+TLuVjewAAAABJRU5ErkJggg==");
                --octo-px-chest-open: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAXCAYAAAARIY8tAAAAXklEQVR42mNgoCP4TyHGb/iKCAWKMCFLwIp+7GAAY2INRVZPlAW09AHN44AaFhC08H+GAQdVMF4LVpy4QREmygJyXT6CLKBZHJCTm0nJ1fSxgBp44DIarYuKUTBMAQBWLUwJmDs4/QAAAABJRU5ErkJggg==");
                --octo-px-pearl: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAbUlEQVR42mNgGAVUAP8JYMoM/vPnD15MrkUEDcZhEWmG2+yhjSUkG77ixA2iLSDL9SALiLWE5LCnuQUww2liAbLhVLcA3XCyIppYg0kxHKcFuAwmxwIUSwgZDMNkFRcgTKTB/wdlaToKRgFxAAA0EcEV1e7mZAAAAABJRU5ErkJggg==");
                --octo-px-frame-ai: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAMElEQVR42mNgYGBgEBCQ+I8NMyBL/vnxAAXDFcElP5xAwT92MNBVAYiDDWP4BJs3AQOdlDVDIEJmAAAAAElFTkSuQmCC");
                --octo-px-frame-me: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAMUlEQVR42mNgYGBgEBCQ+I8NMyBLvvj2HwXDFcEkb7z5g4IZCt7QVQGIgw1j+ASbNwF7/JH1xAD0SgAAAABJRU5ErkJggg==");
                --octo-px-frame-other: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAMklEQVR42mNgYGBgEBCQ+I8NMyBLPvn/HwXDFcEkb/z5g4IZVqygqwIQBxvG8Ak2bwIA+eqSpelDsyEAAAAASUVORK5CYII=");
            }
            /* PIXEL-SPRITES:END */

            /* 气泡底色走 NES 浅色行（$3x），高饱和留给前景的角色/宝箱/代币。
               两者原先共用同一批颜色：金箱蹦在金气泡上、蓝角色跳在蓝气泡上，
               只剩描边可辨。顺带浅底 + 深字也比高饱和深底配白字更耐读 —— 
               气泡里装的是长消息，不是标签。 */
            body[data-octo-skin="pixel"] {
                /* 三档的区分交给边框主色（饱和、色相拉开），底色一律退到极浅。
                   拿底色去区分要么分不开（浅色三档只差 1.2:1），要么压着一段
                   长文本读起来累 —— FC 的对话框本来也是浅底配彩框。 */
                --px-ai: #fcf0c8;
                --px-ai-dk: #f8b800;
                --px-me: #d8ecfc;
                --px-me-dk: #0070ec;
                --px-other: #d8fcfc;
                --px-other-dk: #00a8a8;
                --px-ink: #101018;
            }

            /* 三档气泡：直角 + 九宫格贴图边框。早期版本是 inset 双色斜面，
               但那只是拿 CSS 模仿像素边框，缩放后就不成立了 —— 现在的边框本身
               就是一张 8×8 的 tile，见下面那段注释。 */
            /* 气泡边框走九宫格贴图，不是 CSS 线条。
               `border: 2px solid` + inset 阴影只是在「模仿」像素框：它没有像素
               图案，浏览器一缩放就不再是像素了。这里 8×8 的 tile 切 2、
               border-width 取 4px，一个源像素正好落 2 个屏幕像素 —— 和 48px
               精灵是同一套 2px 网格。边条是竖向渐变、横向平铺，拉伸不会变形。

               边框声明必须在下面每一档里重写一遍，光靠这条通用规则不够：基础层
               给气泡的是 .wk-msg-row:has(.ai-badge) .wk-markdown 这类选择器，
               特异性 (0,4,0)，压得过这里的 (0,2,1)。真机上的表现是「底色换了、
               九宫格和直角却没生效」—— 底色恰好写在够格的三档规则里。 */
            body[data-octo-skin="pixel"] .wk-markdown,
            body[data-octo-skin="pixel"] .wk-fold-msg-text {
                border-radius: 0 !important;
                border: 4px solid transparent !important;
                border-image-slice: 2 fill !important;
                border-image-repeat: stretch !important;
                /* 硬投影，偏移 2px = 一个源像素。FC 的投影是实心色块不是高斯模糊，
                   任何 blur 半径都会立刻把它拉出像素风之外。 */
                box-shadow: 2px 2px 0 rgba(16, 16, 24, 0.20) !important;
                color: var(--px-ink) !important;
                image-rendering: pixelated !important;
                /* 边框已经占了 4px，内距相应收掉，别让气泡整个胖一圈 */
                padding: 6px 10px !important;
            }
            body[data-octo-skin="pixel"] .wk-msg-row:has(.ai-badge) .wk-markdown,
            body[data-octo-skin="pixel"] .wk-msg-row--continue[data-ai-continue="true"] .wk-markdown,
            body[data-octo-skin="pixel"] .wk-fold-msg-text {
                border-image-source: var(--octo-px-frame-ai) !important;
                border-radius: 0 !important;
                border: 4px solid transparent !important;
                border-image-slice: 2 fill !important;
                border-image-repeat: stretch !important;
                box-shadow: 2px 2px 0 rgba(16, 16, 24, 0.20) !important;
                padding: 6px 10px !important;
                color: var(--px-ink) !important;
                image-rendering: pixelated !important;
                background: var(--px-ai) !important;
                --octo-bg: var(--px-ai) !important; /* 贴图没加载出来时的兜底底色 */
            }
            body[data-octo-skin="pixel"] .wk-msg-row--send:not(:has(.ai-badge)) .wk-markdown {
                border-image-source: var(--octo-px-frame-me) !important;
                border-radius: 0 !important;
                border: 4px solid transparent !important;
                border-image-slice: 2 fill !important;
                border-image-repeat: stretch !important;
                box-shadow: 2px 2px 0 rgba(16, 16, 24, 0.20) !important;
                padding: 6px 10px !important;
                color: var(--px-ink) !important;
                image-rendering: pixelated !important;
                background: var(--px-me) !important;
                --octo-bg: var(--px-me) !important;
                color: var(--px-ink) !important;
            }
            body[data-octo-skin="pixel"] .wk-msg-row:not(.wk-msg-row--send):not(:has(.ai-badge)):not([data-ai-continue="true"]) .wk-markdown {
                border-image-source: var(--octo-px-frame-other) !important;
                border-radius: 0 !important;
                border: 4px solid transparent !important;
                border-image-slice: 2 fill !important;
                border-image-repeat: stretch !important;
                box-shadow: 2px 2px 0 rgba(16, 16, 24, 0.20) !important;
                padding: 6px 10px !important;
                color: var(--px-ink) !important;
                image-rendering: pixelated !important;
                background: var(--px-other) !important;
                --octo-bg: var(--px-other) !important;
                color: var(--px-ink) !important;
            }

            /* 这里原本给 AI 气泡挂了一只 32px 的常驻角标。32/24 = 1.33 倍，
               不是整数倍缩放，pixelated 会把源像素切成宽窄不一的块、边缘发脏；
               而 24px 太糊、48px 又盖住气泡。角色改为只在 hover 场景里露面。 */

            /* 引用块左侧立一株海草，引文在右侧。用 ::before 承载，不往 React
               管的行里插节点。原先这里是一根带管口高光的绿水管 —— 形态直接来自
               另一个人的作品，跟章鱼也不搭，换成海草才和这套场景是一路的。 */
            body[data-octo-skin="pixel"] .wk-msg-row .wk-reply-block,
            body[data-octo-skin="pixel"] .wk-msg-row .wk-message-text-reply {
                position: relative !important;
                border-left: none !important;
                border-radius: 0 !important;
                padding: 3px 6px 3px 16px !important;
                background: rgba(16, 16, 24, 0.05) !important;
            }
            body[data-octo-skin="pixel"] .wk-msg-row .wk-reply-block::before,
            body[data-octo-skin="pixel"] .wk-msg-row .wk-message-text-reply::before {
                content: "" !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                bottom: 0 !important;
                width: 16px !important;
                background: var(--octo-px-kelp) left top / 16px 32px repeat-y !important;
                image-rendering: pixelated !important;
            }

            /* ---- 悬停顶箱爆币 ----------------------------------------
             * 场景由 spawnPixelHit() 注入 <body>（在消息的 React 树之外，
             * 免得 reconcile 把它清掉），播完自移除。整段是一次性 keyframes，
             * 静止时页面上没有这个节点，所以零重绘。
             * 注意 transform 上不加 !important —— 那会盖掉 keyframes 本身。
             * ------------------------------------------------------- */
            /* 角色精灵经由这两个变量取，keyframes 只认变量不认具体精灵 —— 换角色
               只是换变量，不用为每种角色复制一套关键帧。 */
            .octo-pixel-hit {
                --oph-stand: var(--octo-px-stand);
                --oph-jump: var(--octo-px-jump);
                position: fixed;
                /* 只要压在消息之上就够。原来的 2147483000 会盖住 Octo 的模态框、
                   下拉和所有浮层 —— 装饰不该有那个优先级。 */
                z-index: 9999;
                width: 56px;
                /* height 与 --oph-rise 由 spawnPixelHit() 按气泡高度写入 */
                pointer-events: none;
                /* 刻意不含 paint：珍珠要飞出这个盒子、落到消息气泡上，
                   paint containment 会把溢出的部分整个裁掉。 */
                contain: layout style;
            }
            .octo-pixel-hit > * {
                position: absolute;
                image-rendering: pixelated;
                background-position: center;
                background-size: contain;
                background-repeat: no-repeat;
                /* 偏移正好是一个源像素（2px），投影因此落在像素网格上而不是糊在半格。
                   不加 !important：这几个节点全程在跑 keyframes。 */
                filter: drop-shadow(2px 2px 0 rgba(16, 16, 24, 0.38));
            }
            .octo-pixel-hit .oph-chest {
                left: 4px;
                top: 0;
                width: 48px;
                height: 48px;
                background-image: var(--octo-px-chest);
                animation: oph-chest-face .75s steps(1, end) 1 both, oph-chest-bump .75s steps(1, end) 1 both, oph-chest-flash .75s steps(1, end) 1 both;
            }
            /* 真人成员派潜水员，AI 派章鱼。data-octo-actor 由 spawnPixelHit 写。 */
            .octo-pixel-hit[data-octo-actor="human"] {
                --oph-stand: var(--octo-px-diver);
                --oph-jump: var(--octo-px-diver-jump);
            }
            .octo-pixel-hit .oph-hero {
                left: 4px;
                bottom: 0;
                width: 48px;
                height: 48px;
                background-image: var(--oph-stand);
                animation: oph-hero-pose .75s steps(1, end) 1 both, oph-hero-jump .75s steps(1, end) 1 both;
            }
            /* 48px = 24px 源精灵的 2 倍，和角色、宝箱同一个缩放级别。
               之前写的 24px 是 1x，整套皮肤里就它一个是另一种像素密度。 */
            .octo-pixel-hit .oph-pearl {
                left: 4px;
                /* 与 PEARL_TOP_PX 对应：起点越低，能落的余量越少，
                   而余量的上限由不得越过气泡顶沿这条硬约束决定。 */
                top: 4px;
                width: 48px;
                height: 48px;
                background-image: var(--octo-px-pearl);
                opacity: 0;
            }
            .octo-pixel-hit .oph-pearl-a { animation: oph-pearl-a 1.15s steps(1, end) 1 forwards; }
            .octo-pixel-hit .oph-pearl-b { animation: oph-pearl-b 1.15s steps(1, end) 1 forwards; }
            .octo-pixel-hit .oph-pearl-c { animation: oph-pearl-c 1.15s steps(1, end) 1 forwards; }

            /* 全部走 steps(1, end)：FC 的动作是逐帧跳变，不是亚像素插值。
               连续缓动会让精灵停在半个像素上 —— 既糊掉像素网格，也没有那个手感。
               40%~52% 三帧钉在同一位置，就是撞击的顿帧（hit stop），打击感全靠它。 */
            @keyframes oph-chest-face {
                0%, 39% { background-image: var(--octo-px-chest); }
                40%, 100% { background-image: var(--octo-px-chest-open); }
            }
            @keyframes oph-chest-bump {
                0%, 39% { transform: translateY(0); }
                42% { transform: translateY(-12px); }
                52% { transform: translateY(-12px); }
                58% { transform: translateY(4px); }
                64% { transform: translateY(-2px); }
                70%, 100% { transform: translateY(0); }
            }
            /* 撞到的那一下闪一帧白。keyframes 里要带上投影，否则会把
               .octo-pixel-hit > * 上的静态 filter 整个覆盖掉。 */
            @keyframes oph-chest-flash {
                0%, 39% { filter: drop-shadow(2px 2px 0 rgba(16, 16, 24, 0.38)); }
                42% { filter: drop-shadow(2px 2px 0 rgba(16, 16, 24, 0.38)) brightness(2.6); }
                50%, 100% { filter: drop-shadow(2px 2px 0 rgba(16, 16, 24, 0.38)); }
            }
            @keyframes oph-hero-pose {
                0%, 5% { background-image: var(--oph-stand); }
                6%, 84% { background-image: var(--oph-jump); }
                85%, 100% { background-image: var(--oph-stand); }
            }
            @keyframes oph-hero-jump {
                0% { transform: translateY(0) scale(1, 1); }
                6% { transform: translateY(6px) scale(1.12, .86); }
                11% { transform: translateY(2px) scale(1.04, .96); }
                16% { transform: translateY(calc(var(--oph-rise, 64px) * -0.30)) scale(.94, 1.08); }
                22% { transform: translateY(calc(var(--oph-rise, 64px) * -0.56)) scale(.96, 1.05); }
                28% { transform: translateY(calc(var(--oph-rise, 64px) * -0.76)) scale(1, 1); }
                34% { transform: translateY(calc(var(--oph-rise, 64px) * -0.90)) scale(1, 1); }
                40% { transform: translateY(calc(var(--oph-rise, 64px) * -1)) scale(1.06, .94); }
                52% { transform: translateY(calc(var(--oph-rise, 64px) * -1)) scale(1.06, .94); }
                58% { transform: translateY(calc(var(--oph-rise, 64px) * -0.86)) scale(1, 1); }
                66% { transform: translateY(calc(var(--oph-rise, 64px) * -0.60)) scale(1, 1); }
                74% { transform: translateY(calc(var(--oph-rise, 64px) * -0.30)) scale(1, 1); }
                82% { transform: translateY(0) scale(1.12, .86); }
                90% { transform: translateY(0) scale(.96, 1.06); }
                100% { transform: translateY(0) scale(1, 1); }
            }
            /* scaleX 在 1 和 .35 之间跳 = 收集物翻面自旋的经典画法。
               位移和自旋必须写在同一个 keyframe 里 —— 两条 transform 动画
               不会叠加，后一条会整个盖掉前一条。
               三条弧线（a 中抛 / b 高抛 / c 低平）形状固定，终点 --oph-x/--oph-y
               挂在每枚币自己身上、由 JS 每次重掷 —— 变量挂在币上而不是容器上，
               币数才能是随机的。 */
            @keyframes oph-pearl-a {
                0%, 41% { opacity: 0; transform: translate(0, 0) scaleX(1); }
                44% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .13), -18px) scaleX(.35); }
                50% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .33), -30px) scaleX(1); }
                58% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .58), -26px) scaleX(.35); }
                66% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .77), -8px) scaleX(1); }
                74% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .92), calc(var(--oph-y, 40px) * .55)) scaleX(.35); }
                82% { opacity: 1; transform: translate(var(--oph-x, -60px), var(--oph-y, 40px)) scaleX(1); }
                88% { opacity: 1; transform: translate(var(--oph-x, -60px), calc(var(--oph-y, 40px) - 8px)) scaleX(.6); }
                94% { opacity: 1; transform: translate(var(--oph-x, -60px), var(--oph-y, 40px)) scaleX(1); }
                100% { opacity: 0; transform: translate(var(--oph-x, -60px), var(--oph-y, 40px)) scaleX(1); }
            }
            @keyframes oph-pearl-b {
                0%, 41% { opacity: 0; transform: translate(0, 0) scaleX(1); }
                44% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .12), -26px) scaleX(.35); }
                50% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .32), -46px) scaleX(1); }
                58% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .56), -42px) scaleX(.35); }
                66% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .76), -18px) scaleX(1); }
                74% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .92), calc(var(--oph-y, 40px) * .5)) scaleX(.35); }
                82% { opacity: 1; transform: translate(var(--oph-x, -60px), var(--oph-y, 40px)) scaleX(1); }
                88% { opacity: 1; transform: translate(var(--oph-x, -60px), calc(var(--oph-y, 40px) - 10px)) scaleX(.6); }
                94% { opacity: 1; transform: translate(var(--oph-x, -60px), var(--oph-y, 40px)) scaleX(1); }
                100% { opacity: 0; transform: translate(var(--oph-x, -60px), var(--oph-y, 40px)) scaleX(1); }
            }
            @keyframes oph-pearl-c {
                0%, 41% { opacity: 0; transform: translate(0, 0) scaleX(1); }
                44% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .10), -14px) scaleX(.35); }
                50% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .30), -24px) scaleX(1); }
                58% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .55), -18px) scaleX(.35); }
                66% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .80), 2px) scaleX(1); }
                74% { opacity: 1; transform: translate(calc(var(--oph-x, -60px) * .93), calc(var(--oph-y, 40px) * .6)) scaleX(.35); }
                82% { opacity: 1; transform: translate(var(--oph-x, -60px), var(--oph-y, 40px)) scaleX(1); }
                88% { opacity: 1; transform: translate(var(--oph-x, -60px), calc(var(--oph-y, 40px) - 6px)) scaleX(.6); }
                94% { opacity: 1; transform: translate(var(--oph-x, -60px), var(--oph-y, 40px)) scaleX(1); }
                100% { opacity: 0; transform: translate(var(--oph-x, -60px), var(--oph-y, 40px)) scaleX(1); }
            }

            /* 滚动时把气泡的 hover 反馈整个停掉。
               指针并没有动，是消息从它底下滑过，于是每条经过的都被 hover 一次、
               上浮 2px 又落回，整个列表在滚动时起伏 —— 这是「滑动体感」最直接的
               来源。属性由 onPixelScroll 挂上，停止滚动 300ms 后摘掉。
               只在本皮肤作用域内关：那个 hover 是基础层的，动它会波及所有主题。 */
            body[data-octo-skin="pixel"][data-octo-px-scrolling] .wk-markdown,
            body[data-octo-skin="pixel"][data-octo-px-scrolling] .wk-fold-msg-text {
                transition: none !important;
            }
            body[data-octo-skin="pixel"][data-octo-px-scrolling] .wk-markdown:hover,
            body[data-octo-skin="pixel"][data-octo-px-scrolling] .wk-fold-msg-text:hover {
                transform: none !important;
                filter: none !important;
            }

            /* 无障碍：开了「减弱动态效果」时整个场景不该出现。JS 侧已经不注入，
               这里再兜一层，防止有节点因异常残留在页面上继续动。 */
            @media (prefers-reduced-motion: reduce) {
                .octo-pixel-hit { display: none !important; }
                body[data-octo-skin="pixel"] .wk-bot-detail-header::after {
                    animation: none !important;
                }
            }

            /* ========================================================
             * 像素乐园 · 全站配色（body[data-octo-global-theme="pixel"]）
             * 只需给出这一组 --octo-global-*，上面那条通用规则会把它们
             * 映射到 Octo 自己的 --wk-* token。
             * ====================================================== */
            body[data-octo-global-theme="pixel"] {
                --octo-global-page: #dfe7f5;
                --octo-global-ink: #101018;
                --octo-global-muted: #55607a;
                --octo-global-soft: #8792a8;
                --octo-global-line: #c3cfe4;
                --octo-global-rail: #ccd8ee;
                --octo-global-side: #eaf0fa;
                --octo-global-main: #f2f6fd;
                --octo-global-panel: #ffffff;
                --octo-global-panel-2: #e8eefa;
                --octo-global-accent: #0070ec;
                --octo-global-accent-2: #f8b800;
                --octo-global-selected: rgba(0, 112, 236, 0.12);
                --octo-global-selected-strong: rgba(0, 112, 236, 0.18);
                --octo-global-hover: rgba(16, 16, 24, 0.055);
                /* 硬投影，零模糊半径 —— 一旦有 blur 就不是 8-bit 了 */
                --octo-global-shadow: 3px 3px 0 rgba(16, 16, 24, 0.16);
            }

            /* ========================================================
             * 像素乐园 · Bot 资料卡
             * 结构层（卡框 / holo / 稀有度 / 3D 倾斜）仍归基础层，这里只换
             * 配色与 banner —— 与世界杯皮肤同样的分工。
             * ====================================================== */
            /* banner：用 CSS 把精灵叠成水下场景（海水 → 海床 → 宝箱 → 角色），
               比手画一张 400×176 的大图省得多，改也只改这几行。
               多背景第一层在最上，所以顺序是从近到远。 */
            body[data-octo-skin="pixel"] .wk-bot-detail-header::before {
                background:
                    repeating-linear-gradient(180deg,
                        rgba(16, 16, 24, 0.10) 0 1px,
                        transparent 1px 4px),
                    var(--octo-px-stand) left 74% bottom 32px / 48px 48px no-repeat,
                    var(--octo-px-chest) left 26% bottom 64px / 48px 48px no-repeat,
                    var(--octo-px-seabed) left bottom / 32px 32px repeat-x,
                    repeating-linear-gradient(105deg,
                        transparent 0 20px,
                        rgba(255, 255, 255, 0.05) 20px 30px),
                    linear-gradient(180deg, #3cbcfc 0%, #0058f8 58%, #0038a8 100%) !important;
                image-rendering: pixelated !important;
                border-radius: 0 !important;
                box-shadow: inset 0 -4px 0 0 var(--px-ink) !important;
                animation: none !important;
            }
            /* CRT 扫描线：FC 本来就是在 CRT 上看的，但改成硬边 1px，
               基础层那版是半透明渐变，糊在像素上会脏。 */
            /* 气泡持续上浮。海底的气泡不动就不像水里。
               ::before 已经被整幅场景占满，所以扫描线并进了它的背景层，
               把 ::after 整个腾出来给气泡 —— header 只有两个伪元素。
               两层竖向平铺，一个循环正好走一个 tile 高度，所以首尾无缝；
               两层位移量不同（72 / 48），于是自然错开成远近两层。 */
            body[data-octo-skin="pixel"] .wk-bot-detail-header::after {
                background-image: var(--octo-px-bubble), var(--octo-px-bubble) !important;
                background-size: 96px 144px, 64px 96px !important;
                background-repeat: repeat-y, repeat-y !important;
                background-color: transparent !important;
                /* 这一行不带 !important，是留给 keyframes 的。写成 background 简写
                   或给它加 !important，动画就会停在第一帧。 */
                background-position: left 14% top 0, left 68% top 0;
                image-rendering: pixelated !important;
                mix-blend-mode: normal !important;
                border-radius: 0 !important;
                opacity: 0.9 !important;
                animation: octo-px-bubble-rise 7s linear infinite !important;
            }
            @keyframes octo-px-bubble-rise {
                from { background-position: left 14% top 0, left 68% top 0; }
                to { background-position: left 14% top -144px, left 68% top -96px; }
            }

            /* 卡壳与面板：直角 + 硬投影，去掉一切圆角和模糊阴影 */
            body[data-octo-skin="pixel"] .wk-modal-shell,
            body[data-octo-skin="pixel"] .wk-bot-detail-content {
                border-radius: 0 !important;
                box-shadow: 6px 6px 0 rgba(16, 16, 24, 0.28) !important;
            }
            /* 信息区块。类名取自 packages/dmworkbase 的 BotDetailModal 源码：
               这张卡真正渲染的是 -desc / -remark-line / -commands / -cmd，
               而 -section / -command-block / -nav-row 在 DOM 里根本不存在。 */
            body[data-octo-skin="pixel"] .wk-bot-detail-desc,
            body[data-octo-skin="pixel"] .wk-bot-detail-remark-line,
            body[data-octo-skin="pixel"] .wk-bot-detail-commands,
            body[data-octo-skin="pixel"] .wk-bot-detail-cmd {
                border-radius: 0 !important;
                border: 2px solid var(--px-ink) !important;
                background: #f4f7ff !important;
                box-shadow: 3px 3px 0 rgba(16, 16, 24, 0.14) !important;
            }

            /* 头像：直角金框，四角各留一个缺口，呼应气泡边框的切角 */
            body[data-octo-skin="pixel"] .wk-bot-detail-header .wk-bot-detail-header-avatar,
            body[data-octo-skin="pixel"] .wk-bot-detail-avatar {
                border-radius: 0 !important;
                border: 4px solid var(--px-ink) !important;
                box-shadow:
                    0 0 0 4px var(--px-ai),
                    6px 6px 0 rgba(16, 16, 24, 0.3) !important;
                image-rendering: pixelated !important;
            }

            /* 名字：深色实心字 + 一层硬投影，不发光也不描边。
               上一版是白字套 6 层 2px 描边 —— 英文还看得过去，中文笔画本就密，
               描边一糊直接连成一片黑（真机上「发车员」三个字基本读不出来）。
               描边这种做法只适合字形简单、字号又大的场合。 */
            body[data-octo-skin="pixel"] .wk-bot-detail-name {
                color: var(--px-ink) !important;
                -webkit-text-fill-color: var(--px-ink) !important;
                background: none !important;
                text-shadow: 2px 2px 0 rgba(16, 16, 24, 0.20) !important;
                animation: none !important;
                filter: none !important;
            }
            body[data-octo-skin="pixel"] .wk-bot-detail-id,
            body[data-octo-skin="pixel"] .wk-bot-detail-label {
                border-radius: 0 !important;
                color: var(--px-ink) !important;
            }
            body[data-octo-skin="pixel"] .wk-bot-detail-label {
                background: var(--px-other) !important;
                border: 2px solid var(--px-ink) !important;
            }

            /* 主按钮 = 金色像素键，按下去有 2px 位移，硬投影同步收掉。
               「发送消息」是个不带 className 的 Semi <Button block>，所以按
               .semi-button-block 命中 —— 卡里的整宽按钮只有主操作是 block，
               铅笔那类图标按钮不是，正好分开。 */
            body[data-octo-skin="pixel"] .wk-bot-detail-content .semi-button-block,
            body[data-octo-skin="pixel"] .wk-bot-detail-claw-btn {
                border-radius: 0 !important;
                border: 2px solid var(--px-ink) !important;
                background: var(--px-ai) !important;
                color: var(--px-ink) !important;
                box-shadow: 4px 4px 0 rgba(16, 16, 24, 0.28) !important;
                text-shadow: none !important;
            }
            body[data-octo-skin="pixel"] .wk-bot-detail-content .semi-button-block:hover {
                background: #ffd040 !important;
                color: var(--px-ink) !important;
            }
            body[data-octo-skin="pixel"] .wk-bot-detail-content .semi-button-block:active,
            body[data-octo-skin="pixel"] .wk-bot-detail-claw-btn:active {
                transform: translate(2px, 2px);
                box-shadow: 2px 2px 0 rgba(16, 16, 24, 0.28) !important;
            }

            /* 稀有度：卡框逻辑仍是基础层的，这里只把辉光换成硬边描边 */
            body[data-octo-skin="pixel"] .wk-bot-detail-content[data-octo-rarity],
            body[data-octo-skin="pixel"] .wk-modal-shell[data-octo-rarity] {
                border-radius: 0 !important;
            }
            body[data-octo-skin="pixel"] .wk-modal-shell[data-octo-rarity="SSR"],
            body[data-octo-skin="pixel"] .wk-modal-shell[data-octo-rarity="UR"] {
                box-shadow:
                    0 0 0 4px var(--px-ai),
                    8px 8px 0 rgba(16, 16, 24, 0.3) !important;
            }

            /* ---- 像素乐园 · Bot 卡余下的圆角面 --------------------------
             * 真机截图里这几处还是原生观感：关闭键是圆形灰底、稀有度角标是圆角
             * 药丸、卡壳四角仍带圆角。它们分属不同的 DOM 层级，按类名逐个覆盖
             * 漏了就是漏了 —— 所以这里连结构选择器一起挂。
             * ---------------------------------------------------------- */
            /* 关闭键：圆形 → 方形像素键。类名来自 WKModal 自己渲染的
               .wk-modal-custom-close-btn（既不是 Semi 的，也不是基础层注释里
               写的 .wk-bot-detail-route-close）。 */
            body[data-octo-skin="pixel"] .wk-modal-custom-close-btn {
                border-radius: 0 !important;
                border: 2px solid var(--px-ink) !important;
                background: #fff !important;
                box-shadow: 2px 2px 0 rgba(16, 16, 24, 0.28) !important;
                backdrop-filter: none !important;
            }
            body[data-octo-skin="pixel"] .wk-modal-custom-close-btn:active {
                transform: translate(2px, 2px);
                box-shadow: none !important;
            }
            body[data-octo-skin="pixel"] .wk-modal-custom-close-btn .semi-icon {
                color: var(--px-ink) !important;
                filter: none !important;
            }

            /* 稀有度角标：药丸 → 方牌，辉光换成硬投影 */
            body[data-octo-skin="pixel"] .wk-bot-detail-content[data-octo-rarity]::after {
                border-radius: 0 !important;
                border: 2px solid var(--px-ink) !important;
                box-shadow: 2px 2px 0 rgba(16, 16, 24, 0.3) !important;
                text-shadow: none !important;
                filter: none !important;
                animation: none !important;
                backdrop-filter: none !important;
            }

            /* 卡壳与它内层的滚动容器：圆角一路清到底，
               只清最外层的话，内层一裁又把圆角露出来。 */
            body[data-octo-skin="pixel"] .wk-modal-content,
            body[data-octo-skin="pixel"] .wk-modal-shell,
            body[data-octo-skin="pixel"] .wk-modal-body,
            body[data-octo-skin="pixel"] .wk-bot-detail-content,
            body[data-octo-skin="pixel"] .wk-bot-detail-header {
                border-radius: 0 !important;
            }

            /* 头像：外框已是方的，内层图片还是圆的，方框套圆图很别扭 */
            body[data-octo-skin="pixel"] .wk-bot-detail-header-avatar img,
            body[data-octo-skin="pixel"] .wk-bot-detail-avatar img {
                border-radius: 0 !important;
            }

            /* 在线状态点：圆点 → 像素方点 */
            body[data-octo-skin="pixel"] .wk-bot-detail-header [class*="status"],
            body[data-octo-skin="pixel"] .wk-bot-detail-header [class*="online"] {
                border-radius: 0 !important;
            }

            /* ========================================================
             * 像素乐园 · 用户资料卡 + 两卡通用的像素质感
             *
             * 用户卡和 Bot 卡是两套完全不同的 DOM：Bot 卡走 WKModal，用户卡走
             * RoutePage + 通用的 Sections 组件（类名 .wk-route-* / .wk-section-*，
             * 见 packages/dmworkbase/src/Components/{RoutePage,Sections,UserInfo}）。
             * .wk-route 是所有路由页共用的外壳，所以这里用 :has(.wk-userinfo)
             * 把作用域收在用户卡上，不去动侧栏那些同样走 RoutePage 的面板。
             * ====================================================== */
            body[data-octo-skin="pixel"] .wk-route-box:has(.wk-userinfo),
            body[data-octo-skin="pixel"] .wk-route-content:has(.wk-userinfo),
            body[data-octo-skin="pixel"] .wk-userinfo,
            body[data-octo-skin="pixel"] .wk-userinfo-content {
                border-radius: 0 !important;
            }
            body[data-octo-skin="pixel"] .wk-route-box:has(.wk-userinfo) {
                border: 2px solid var(--px-ink) !important;
                box-shadow: 6px 6px 0 rgba(16, 16, 24, 0.28) !important;
            }
            /* 头部关闭键：与 Bot 卡那颗保持同一种手感 */
            body[data-octo-skin="pixel"] .wk-route-box:has(.wk-userinfo) .wk-route-header-close {
                border-radius: 0 !important;
                border: 2px solid var(--px-ink) !important;
                background: #fff !important;
                box-shadow: 2px 2px 0 rgba(16, 16, 24, 0.28) !important;
            }
            body[data-octo-skin="pixel"] .wk-route-box:has(.wk-userinfo) .wk-route-header-close:active {
                transform: translate(2px, 2px);
                box-shadow: none !important;
            }
            /* 头像：方形像素金框，内层图片一并去圆角 —— 方框套圆图很别扭 */
            body[data-octo-skin="pixel"] .wk-userinfo-user-avatar,
            body[data-octo-skin="pixel"] .wk-userinfo-user-avatar img {
                border-radius: 0 !important;
            }
            body[data-octo-skin="pixel"] .wk-userinfo-user-avatar {
                border: 4px solid var(--px-ink) !important;
                box-shadow: 0 0 0 4px var(--px-ai-dk), 6px 6px 0 rgba(16, 16, 24, 0.3) !important;
                image-rendering: pixelated !important;
            }
            /* 名字：深色实心字 + 一层硬投影。描边留给字号大、字形简单的场合，
               中文笔画一密就糊成一片（Bot 卡上已经栽过一次）。 */
            body[data-octo-skin="pixel"] .wk-userinfo-user-info-name {
                color: var(--px-ink) !important;
                -webkit-text-fill-color: var(--px-ink) !important;
                text-shadow: 2px 2px 0 rgba(16, 16, 24, 0.18) !important;
                background: none !important;
                filter: none !important;
            }
            /* 主按钮 = 金色像素键。这里同样是不带 className 的 Semi <Button block>。 */
            body[data-octo-skin="pixel"] .wk-userinfo .semi-button-block,
            body[data-octo-skin="pixel"] .wk-userinfo-footer-sendbutton .semi-button {
                border-radius: 0 !important;
                border: 2px solid var(--px-ink) !important;
                background: var(--px-ai-dk) !important;
                color: var(--px-ink) !important;
                box-shadow: 4px 4px 0 rgba(16, 16, 24, 0.28) !important;
                text-shadow: none !important;
            }
            body[data-octo-skin="pixel"] .wk-userinfo .semi-button-block:hover,
            body[data-octo-skin="pixel"] .wk-userinfo-footer-sendbutton .semi-button:hover {
                background: #ffd040 !important;
            }
            body[data-octo-skin="pixel"] .wk-userinfo .semi-button-block:active,
            body[data-octo-skin="pixel"] .wk-userinfo-footer-sendbutton .semi-button:active {
                transform: translate(2px, 2px);
                box-shadow: 2px 2px 0 rgba(16, 16, 24, 0.28) !important;
            }

            /* ---- Sections：用户卡的信息区块，与 Bot 卡的 -desc 同款处理 ---- */

            body[data-octo-skin="pixel"] .wk-userinfo .wk-section-row {
                border-radius: 0 !important;
            }
            body[data-octo-skin="pixel"] .wk-userinfo .wk-section {

            }
            body[data-octo-skin="pixel"] .wk-userinfo .wk-section-title {
                color: var(--px-ink) !important;

            }

            /* ---- 四角铆钉 ------------------------------------------------
             * 光是"直角 + 描边"还只是个方框，铆钉才是 8-bit 面板的招牌。
             * 用四层纯色渐变当 4×4 的方点打在四角：不占伪元素（那两个位置在
             * 别处已经排满了），也不注入任何节点。
             * ------------------------------------------------------------ */
            body[data-octo-skin="pixel"] .wk-userinfo .wk-section,
            body[data-octo-skin="pixel"] .wk-bot-detail-desc,
            body[data-octo-skin="pixel"] .wk-bot-detail-commands {

             * 渐变到基础层的白，在彩色气泡上压出一道色差。顺带去掉圆角、把提示

            body[data-octo-skin="pixel"] .wk-markdown.octo-clamp:not(.octo-expanded)::after,

             * 这里），所以背景不会跟着消息走，气泡动起来也不会每帧重绘消息。
             *
             * 底色要压得比气泡暗一档：三档气泡都是极浅的底，背景要是也一样浅，
             * 气泡就浮不出来，只能全靠那 4px 边框撑着。

            /* 外层只兜底色。真正承载背景的是下面的滚动层 —— Octo 给

            body[data-octo-skin="pixel"] .wk-conversation-content {

                --wk-text-strong: #eaf2fc !important;

                background-position:

            @keyframes octo-px-water {
                from {
                    background-position:
                        right 4% top 0, left bottom, 0 0, 0 0;
                }
                to {

            @media (prefers-reduced-motion: reduce) {

             * 这些走的是 .wk-message-base-bubble（见 packages/dmworkbase 的

            body[data-octo-skin="pixel"] .wk-message-base-bubble {

                background: var(--px-other) !important;
                color: var(--px-ink) !important;

            body[data-octo-skin="pixel"] .wk-message-base-bubble-box.send .wk-message-base-bubble {
                border-image-source: var(--octo-px-frame-me) !important;

            /* 文件卡片内部的字与角标一并压回墨色 —— 它们原本取的是全局文本 token，
               而那几个 token 在滚动层上已经被翻成浅色了。 */
            body[data-octo-skin="pixel"] .wk-message-file-name,
            body[data-octo-skin="pixel"] .wk-message-file-meta,
            body[data-octo-skin="pixel"] .wk-message-file-action,
            body[data-octo-skin="pixel"] .wk-message-file-caption {

            body[data-octo-skin="pixel"] .wk-message-file-ext {
                border-radius: 0 !important;
                border: 2px solid var(--px-ink) !important;
                background: var(--px-ai) !important;
                color: var(--px-ink) !important;
            }
            /* 图片本身不该被浅底染色，去掉内距、只留边框当相框 */
            body[data-octo-skin="pixel"] .wk-message-base-bubble:has(img),
            body[data-octo-skin="pixel"] .wk-message-base-bubble:has(video) {
                padding: 0 !important;
                background: transparent !important;
            }
            body[data-octo-skin="pixel"] .wk-message-base-bubble img,
            body[data-octo-skin="pixel"] .wk-message-base-bubble video {
                border-radius: 0 !important;
            }

            /* 引用块：底色要自带，不能靠半透明。它可能落在气泡之外，
               直接压在深海背景上 —— 半透明黑只会让它更暗。 */
            body[data-octo-skin="pixel"] .wk-msg-row .wk-reply-block,
            body[data-octo-skin="pixel"] .wk-msg-row .wk-message-text-reply {

            body[data-octo-skin="pixel"] .wk-message-text-reply-authorname,

            /* ---- 发言人名字 ------------------------------------------------
             * 基础层按浅色底配的：AI 名字是紫青流光、自己发的是深绿 #2f9163。
             * 换成深海底之后这些都读不出来了。特异性要跟基础层对齐 —— 它那几条
             * 带 :has()，(0,4,0)，比 body[data-octo-skin] .wk-msg-row-sender 高。
             * ---------------------------------------------------------------- */
            body[data-octo-skin="pixel"] .wk-msg-row:has(.ai-badge) .wk-msg-row-sender,
            body[data-octo-skin="pixel"] .wk-msg-row--continue[data-ai-continue="true"] .wk-msg-row-sender {

                background-clip: border-box !important;
                -webkit-text-fill-color: #f8d878 !important;

            }
            body[data-octo-skin="pixel"] .wk-msg-row--send:not(:has(.ai-badge)) .wk-msg-row-sender {
                color: #86e8b4 !important;

            body[data-octo-skin="pixel"] .wk-msg-row:not(.wk-msg-row--send):not(:has(.ai-badge)):not([data-ai-continue="true"]) .wk-msg-row-sender {

            /* ---- 时间戳与分割线：直接落在背景上的那几处文字 ----------------

             * 原生颜色是 rgba(28,28,35,.4) 近黑，且只有 AI 那一档被覆盖过，

             * 等于把那个坑重走一遍。
             * AI 档的基础层规则带 :has()，(0,4,0)，所以这里要按档写全才压得过。
             * ---------------------------------------------------------------- */
            body[data-octo-skin="pixel"] .wk-msg-row:has(.ai-badge) .wk-msg-row-timestamp,
            body[data-octo-skin="pixel"] .wk-msg-row--continue[data-ai-continue="true"] .wk-msg-row-timestamp,
            body[data-octo-skin="pixel"] .wk-msg-row .wk-msg-row-timestamp,

<body data-octo-skin="pixel">

<script>
// 与 utils/octoBeautify.ts 的 spawnPixelHit / onPixelHover 同逻辑
const SPRITE = 48, W = SPRITE + 8, RISE_MIN = 28, RISE_MAX = 96, PEARL_TOP = 4, LAND_MAX = 10, MS = 1550, COOLDOWN = 1700, HOVER_DELAY = 350, SCROLL_QUIET = 300;
const PEARL_MIN = 1, PEARL_MAX = 10, PEARL_INSET = 44, REACH_MAX = 420;
const cooling = new WeakSet();
function spawn(bubble) {
  const r = bubble.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const height = Math.min(Math.round(r.height) + SPRITE, SPRITE * 2 + RISE_MAX);
  let left = r.right + 8, flipped = false;
  if (left + W > window.innerWidth - 6) { left = r.left - 8 - W; flipped = true; }
  if (left < 6) return;
  const top = Math.max(6, Math.min(Math.round(r.bottom) - height, window.innerHeight - height - 6));
  const fx = document.createElement('div');
  fx.className = 'octo-pixel-hit';
  fx.setAttribute('aria-hidden', 'true');
  fx.style.left = Math.round(left) + 'px';
  fx.style.top = Math.round(top) + 'px';
  fx.style.height = height + 'px';
  fx.style.setProperty('--oph-rise', Math.max(RISE_MIN, height - SPRITE * 2) + 'px');
  const span = Math.min(Math.round(r.width) + 8, REACH_MAX);
  const reach = Math.max(48, span - PEARL_INSET);

  const crate = document.createElement('div');
  crate.className = 'oph-chest';
  fx.appendChild(crate);

  const pearlCount = PEARL_MIN + Math.floor(Math.random() * (PEARL_MAX - PEARL_MIN + 1));
  for (let i = 0; i < pearlCount; i++) {
    const at = pearlCount <= 1 ? 0.5 : i / (pearlCount - 1);
    const pearl = document.createElement('div');
    pearl.className = 'oph-pearl oph-pearl-' + (at < 0.34 ? 'c' : at < 0.67 ? 'a' : 'b');
    const dist = PEARL_INSET + reach * ((i + Math.random()) / pearlCount);
    pearl.style.setProperty('--oph-x', Math.round(flipped ? dist : -dist) + 'px');
    pearl.style.setProperty('--oph-y', Math.round(Math.random() * LAND_MAX) + 'px');
    pearl.style.animationDuration = (1.02 + Math.random() * 0.26).toFixed(2) + 's';
    pearl.style.animationDelay = Math.round(Math.random() * 90) + 'ms';
    fx.appendChild(pearl);
  }

  const hero = document.createElement('div');
  hero.className = 'oph-hero';
  fx.appendChild(hero);

  document.body.appendChild(fx);
  sceneLive = true;
  setTimeout(() => { fx.remove(); sceneLive = false; }, MS);
}
let hoverTimer, hoverTarget = null, sceneLive = false, scrolledAt = 0;
// 场景是 fixed 定位、按 spawn 时的坐标钉住的，列表一滚就和消息脱节了
let scrollFlagTimer;
document.addEventListener('scroll', () => {
  scrolledAt = Date.now();
  clearTimeout(hoverTimer);
  hoverTarget = null;
  document.body.setAttribute('data-octo-px-scrolling', '');
  clearTimeout(scrollFlagTimer);
  scrollFlagTimer = setTimeout(() => document.body.removeAttribute('data-octo-px-scrolling'), SCROLL_QUIET);
  if (!sceneLive) return;
  sceneLive = false;
  document.querySelectorAll('.octo-pixel-hit').forEach((el) => el.remove());
}, true);
document.addEventListener('pointerover', (e) => {
  const bubble = e.target instanceof Element ? e.target.closest('.wk-markdown, .wk-fold-msg-text') : null;
  if (bubble === hoverTarget) return;
  hoverTarget = bubble;
  clearTimeout(hoverTimer);
  if (!bubble || cooling.has(bubble)) return;
  hoverTimer = setTimeout(() => {
    if (hoverTarget !== bubble) return;
    if (Date.now() - scrolledAt < SCROLL_QUIET) return;
    if (document.querySelector('.octo-pixel-hit')) return;
    cooling.add(bubble);
    setTimeout(() => cooling.delete(bubble), COOLDOWN);
    spawn(bubble);
  }, HOVER_DELAY);
}, true);
</script>
